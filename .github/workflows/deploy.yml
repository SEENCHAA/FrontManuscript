name: Deploy to GitHub Pages

on:
  push:
    # Указываем ветки, при изменении которых будет запускаться деплой
    branches: [ lab6-gh-pages ]

# Разрешения для GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один деплой одновременно
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Работа по сборке (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Используем свежую версию Node.js
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend # <-- ВАЖНО: работаем в папке frontend

      - name: Build
        run: npm run build
        working-directory: ./frontend # <-- ВАЖНО: собираем в папке frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist # <-- ВАЖНО: результат сборки лежит тут

  # Работа по публикации (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4